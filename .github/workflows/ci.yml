name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests and write machine-readable results
        run: |
          mkdir -p test-results
          npm test -- --reporter=default --reporter=json --outputFile=test-results/vitest.json
      - name: Publish test summary and registry mapping
        if: ${{ always() && hashFiles('test-results/vitest.json') != '' }}
        run: node scripts/publish-test-summary.mjs
      - name: Upload structured test results
        if: ${{ always() && hashFiles('test-results/registry-results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Type-check and build
        run: npm run build
