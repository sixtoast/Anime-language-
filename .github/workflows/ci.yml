name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests and write machine-readable results
        run: |
          mkdir -p test-results
          npm test -- --reporter=default --reporter=json --outputFile=test-results/vitest.json
      - name: Publish test summary and registry mapping
        if: ${{ always() && hashFiles('test-results/vitest.json') != '' }}
        run: node scripts/publish-test-summary.mjs
      - name: Upload structured test results
        if: ${{ always() && hashFiles('test-results/registry-results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish latest results for the public workbench
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('test-results/registry-results.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp test-results/registry-results.json /tmp/registry-results.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-results
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/registry-results.json latest.json
          git add latest.json
          git commit -m "Publish CI test results for ${GITHUB_SHA:0:7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-results
      - name: Type-check and build
        if: ${{ always() }}
        run: npm run build
